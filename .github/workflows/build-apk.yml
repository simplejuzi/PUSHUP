name: 打包 PUSHUP APK

# 自动构建：Web 源码或本配置变更时；也可在 Actions 页面手动点「Run workflow」
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'capacitor.config.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 确认 SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      # Capacitor 需要一个只含网页资源的 webDir，避免把 docs/预览图等打进 APK
      - name: 生成本地网页资源 www/
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'if("serviceWorker" in navigator&&location.protocol!=="file:"){\n  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});\n}'
          if old not in s:
              raise SystemExit('未找到 Service Worker 注册代码，停止构建')
          p.write_text(s.replace(old, '/* APK: 资源已在本地，禁用 Service Worker */', 1), encoding='utf-8')
          print('已关闭 APK 副本的 Service Worker 注册')
          PY
          ls -la www

      - name: 安装 Capacitor
        run: npm install --no-audit --no-fund

      - name: 生成 Android 工程并同步资源
        run: |
          npx cap add android
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html && echo "网页资源已进 APK assets"

      # Android 14 = API 34；显式锁定 compileSdk / targetSdk，保证在 14/15/16 上可装可跑
      - name: 适配 Android 14+（API 34）
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/variables.gradle')
          s = p.read_text()
          s = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 23', s)
          s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 34', s)
          s = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 34', s)
          p.write_text(s)
          print('SDK 配置：')
          print('\n'.join(l.strip() for l in s.splitlines() if 'SdkVersion' in l))
          PY

      - name: 换成默认橙色 P 桌面图标
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dest="android/app/src/main/res/mipmap-$d"
            mkdir -p "$dest"
            cp icons/icon-512.png "$dest/ic_launcher.png"
            cp icons/icon-512.png "$dest/ic_launcher_round.png"
          done
          # 去掉自适应图标 XML，统一用 PNG 图标
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          echo "桌面图标已替换"

      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: 收集产物
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PUSHUP-v1.0.apk
          ls -lh PUSHUP-v1.0.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging PUSHUP-v1.0.apk 2>/dev/null | grep -iE "package:|sdkVersion|application-label" | head -6 || true
          else
            echo "aapt 不可用，跳过包信息打印"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PUSHUP-APK
          path: PUSHUP-v1.0.apk
          if-no-files-found: error
          retention-days: 90

      # 便于手机上直接下载；失败不影响 APK 本身
      - name: 发布到 Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0-apk-${{ github.run_number }}" PUSHUP-v1.0.apk \
            --title "PUSHUP v1.0 · Android 安装包 (构建 #${{ github.run_number }})" \
            --notes "由 GitHub Actions 自动构建。把 APK 传到手机，允许「未知来源」后安装即可。数据只存在手机本地。"
