<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>PUSHUP 管理台</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1b1d21; --sub:#6b7280; --sub2:#9aa1ab;
  --line:#e6e8ec; --soft:#f2f3f6; --accent:#FF6A3D; --accent-soft:#FFEDE7;
  --danger:#E5484D; --danger-soft:#FDECEC; --ok:#0F7A54; --ok-soft:#E7F5EF;
  --shadow:0 1px 2px rgba(16,18,22,.05),0 8px 24px rgba(16,18,22,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161a; --card:#1c1f24; --ink:#eef0f3; --sub:#a1a8b3; --sub2:#767e8a;
    --line:#2a2e35; --soft:#23272e; --accent:#FF7A50; --accent-soft:#3a241d;
    --danger:#FF6369; --danger-soft:#3b2124; --ok:#4CC38A; --ok-soft:#1d332a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
a{color:var(--accent);text-decoration:none}
[hidden]{display:none!important}

/* ---------- 登录 ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);padding:26px 24px 22px}
.blogo{width:44px;height:44px;border-radius:13px;background:var(--accent);color:#fff;
  font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.lcard h1{font-size:17px;margin:0 0 4px;letter-spacing:-.2px}
.lsub{margin:0 0 18px;color:var(--sub);font-size:12px}
.lcard label{display:block;margin-bottom:11px;font-size:11.5px;color:var(--sub);font-weight:650}
.lcard input{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--soft);color:var(--ink);outline:none;font-size:13.5px}
.lcard input:focus{border-color:var(--accent);background:var(--card)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  padding:8px 13px;font-weight:650;font-size:12.5px;transition:.12s}
.btn:hover{border-color:var(--sub2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.wide{width:100%;margin-top:4px;padding:11px}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:8px}
.lerr{min-height:16px;margin-top:10px;color:var(--danger);font-size:11.5px}
.lnote{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  color:var(--sub2);font-size:11px;line-height:1.6}

/* ---------- 框架 ---------- */
.app{display:flex;min-height:100vh}
.side{width:196px;flex:none;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:18px 16px 14px;font-weight:750;font-size:13.5px}
.bdot{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
#nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px;flex:1;overflow-y:auto}
#nav button{border:0;background:transparent;color:var(--sub);text-align:left;
  padding:9px 11px;border-radius:9px;font-size:12.5px;font-weight:650;display:flex;
  align-items:center;justify-content:space-between;gap:8px}
#nav button:hover{background:var(--soft);color:var(--ink)}
#nav button.on{background:var(--accent-soft);color:var(--accent)}
#nav button i{font-style:normal;font-size:10.5px;color:var(--sub2);font-weight:700}
#nav button.on i{color:var(--accent)}
.sidefoot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--sub2);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sub2);display:inline-block;margin-right:5px}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--danger)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);
  background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h2{font-size:15px;margin:0;letter-spacing:-.2px}
.topact{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.content{padding:16px 20px 40px;max-width:1180px;width:100%}

/* ---------- 组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card.pad{padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.stat span{font-size:11px;color:var(--sub);font-weight:650}
.stat.warn b{color:var(--accent)}
h3.sec{font-size:12px;color:var(--sub);font-weight:750;letter-spacing:.02em;margin:0 0 8px}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;color:var(--sub);font-weight:700;padding:10px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);display:inline-flex;
  align-items:center;justify-content:center;font-size:12px;overflow:hidden;vertical-align:-7px;margin-right:7px}
.av img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;
  background:var(--soft);color:var(--sub)}
.tag.on{background:var(--accent-soft);color:var(--accent)}
.tag.g{background:var(--ok-soft);color:var(--ok)}
.srch{display:flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);
  border-radius:9px;padding:6px 10px}
.srch input{border:0;background:transparent;color:var(--ink);outline:none;font-size:12.5px;width:150px}
.sel{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:12.5px}
.empty{padding:34px 16px;text-align:center;color:var(--sub2);font-size:12.5px;line-height:1.8}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent);
  border-radius:12px;padding:11px 13px;font-size:12px;margin-bottom:14px;line-height:1.6}
.banner b{font-weight:800}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 10px;font-size:12.5px}
.kv span{color:var(--sub)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--sub);font-weight:650;margin-bottom:5px}
.fld input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--soft);color:var(--ink);outline:none;font-size:12.5px}
.fld input:focus{border-color:var(--accent);background:var(--card)}
.hint{font-size:11px;color:var(--sub2);margin-top:5px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.row2{grid-template-columns:1fr}}

/* ---------- 弹窗 / 提示 ---------- */
.modal{position:fixed;inset:0;background:rgba(12,14,18,.5);display:flex;align-items:center;
  justify-content:center;padding:18px;z-index:60;opacity:0;pointer-events:none;transition:.16s}
.modal.on{opacity:1;pointer-events:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.3);
  width:100%;max-width:560px;max-height:86vh;overflow-y:auto;padding:18px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mhead b{font-size:14px}
.mclose{border:0;background:var(--soft);color:var(--sub);width:28px;height:28px;border-radius:9px;font-size:14px}
.mimgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.mimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#1f2329;color:#fff;
  padding:9px 16px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.18s;z-index:80;max-width:86vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{padding:30px;text-align:center;color:var(--sub2);font-size:12.5px}

@media(max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);
    flex-direction:column}
  .brand{padding:13px 14px 9px}
  #nav{flex-direction:row;overflow-x:auto;padding:0 10px 10px;gap:6px}
  #nav button{white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--soft)}
  #nav button i{display:none}
  .sidefoot{padding:8px 14px}
  .top{padding:12px 14px}
  .content{padding:12px 14px 40px}
  .clip{max-width:180px}
}
</style>
</head>
<body>

<!-- ================= 登录 ================= -->
<div class="login" id="login">
  <form class="lcard" onsubmit="doLogin(event)">
    <div class="blogo">P</div>
    <h1>PUSHUP 管理台</h1>
    <p class="lsub">用户 / 动态 / 评论 / 私聊 / 训练记录</p>
    <label>账号<input id="lu" autocomplete="username" placeholder="admin" value=""></label>
    <label>密码<input id="lp" type="password" autocomplete="current-password" placeholder="admin" value=""></label>
    <button class="btn primary wide" type="submit">登录</button>
    <div class="lerr" id="lerr"></div>
    <div class="lnote">入口账号密码都是 <b>admin</b>。<br>
      这只是本地入口提示，真正的数据权限由下方配置的 Supabase 密钥决定。</div>
  </form>
</div>

<!-- ================= 主界面 ================= -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><span class="bdot">P</span>管理台</div>
    <nav id="nav">
      <button data-v="dash" class="on">概览</button>
      <button data-v="users">用户<i id="nUsers"></i></button>
      <button data-v="posts">动态<i id="nPosts"></i></button>
      <button data-v="comments">评论<i id="nComments"></i></button>
      <button data-v="chats">私聊<i id="nChats"></i></button>
      <button data-v="records">训练记录<i id="nRecords"></i></button>
      <button data-v="settings">连接设置</button>
    </nav>
    <div class="sidefoot">
      <span id="conn"><span class="dot"></span>未连接</span>
      <button class="btn sm" onclick="logout()">退出</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <h2 id="vtitle">概览</h2>
      <div class="topact" id="topact"></div>
    </header>
    <div class="content" id="content"><div class="loading">载入中…</div></div>
  </main>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox" id="mbox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   PUSHUP 管理台 · 单文件、无依赖
   源码里不含任何密钥：Project URL / anon key / service_role
   全部由使用者在本机填写，只存在浏览器 localStorage。
   ============================================================ */

var CFG_KEY = "pushup_admin_cfg_v1";
var OK_KEY  = "pushup_admin_ok";
var DB_KEY  = "sql:pushup_admin_v1";

var CFG = { url: "", key: "", secret: "" };
var S = { profiles: [], posts: [], likes: [], comments: [], messages: [], records: [], at: 0, view: "dash" };
var Q = { users: "", posts: "", postsVis: "all", comments: "", chats: "", recUser: "" };

/* ---------- 小工具 ---------- */
function el(id){ return document.getElementById(id); }
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function num(n){ return (Number(n) || 0).toLocaleString("zh-CN"); }
function fmtTs(ts){
  var d = new Date(Number(ts) || 0);
  if (!Number(ts) || isNaN(d.getTime())) return "—";
  return d.getFullYear() + "/" + p2(d.getMonth() + 1) + "/" + p2(d.getDate()) +
    " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
}
function p2(n){ return String(n).padStart(2, "0"); }
function fromNow(ts){
  var t = Number(ts) || 0;
  if (!t) return "—";
  var s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  if (s < 2592000) return Math.floor(s / 86400) + " 天前";
  return fmtTs(t).slice(0, 10);
}
var toastTimer = null;
function toast(msg){
  var t = el("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}
function openModal(html){ el("mbox").innerHTML = html; el("modal").classList.add("on"); }
function closeModal(){ el("modal").classList.remove("on"); }
function confirmBox(title, text, okText, onOk){
  openModal(
    '<div class="mhead"><b>' + esc(title) + '</b>' +
    '<button class="mclose" onclick="closeModal()">✕</button></div>' +
    '<div style="font-size:12.5px;line-height:1.7;color:var(--sub)">' + text + '</div>' +
    '<div class="mfoot"><button class="btn" onclick="closeModal()">取消</button>' +
    '<button class="btn danger" id="mok">' + esc(okText) + '</button></div>'
  );
  el("mok").onclick = function(){ closeModal(); onOk(); };
}

/* ---------- 配置 ---------- */
function loadCfg(){
  try{
    var raw = localStorage.getItem(CFG_KEY);
    if (raw){ var d = JSON.parse(raw); CFG.url = d.url || ""; CFG.key = d.key || ""; CFG.secret = d.secret || ""; }
  }catch(e){}
}
function saveCfg(){
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); }catch(e){}
}
function connected(){ return !!(CFG.url && (CFG.key || CFG.secret)); }
function privileged(){ return !!CFG.secret; }

/* ---------- 网络 ---------- */
function baseUrl(){
  var u = String(CFG.url || "").trim().replace(/\/+$/, "");
  return u;
}
function headers(extra){
  var token = CFG.secret || CFG.key;
  var h = {
    "apikey": CFG.key || CFG.secret,
    "Authorization": "Bearer " + token,
    "Content-Type": "application/json"
  };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
function api(path, opt){
  if (!connected()) return Promise.reject(new Error("还没配置 Project URL 与密钥，先去「连接设置」填一下"));
  var o = opt || {};
  return fetch(baseUrl() + path, {
    method: o.method || "GET",
    headers: headers(o.headers),
    body: o.body
  }).then(function(r){
    return r.text().then(function(txt){
      var data = null;
      if (txt){ try{ data = JSON.parse(txt); }catch(e){ data = txt; } }
      if (!r.ok){
        var msg = (data && (data.message || data.msg || data.error_description || data.hint || data.error)) ||
                  ("HTTP " + r.status);
        var err = new Error(msg === "Invalid API key" ? "密钥无效" :
                           r.status === 401 ? "密钥无效或没有权限（401）" :
                           r.status === 403 ? "没有权限，可能需要管理密钥（403）" : String(msg));
        err.status = r.status;
        err.body = data;
        throw err;
      }
      return data;
    });
  });
}
function qs(obj){
  var a = [];
  for (var k in obj){ if (obj[k] !== "" && obj[k] != null) a.push(k + "=" + obj[k]); }
  return a.length ? "?" + a.join("&") : "";
}

/* ---------- 登录 ---------- */
function doLogin(ev){
  if (ev) ev.preventDefault();
  var u = (el("lu").value || "").trim();
  var p = (el("lp").value || "").trim();
  if (u === "admin" && p === "admin"){
    try{ sessionStorage.setItem(OK_KEY, "1"); }catch(e){}
    el("lerr").textContent = "";
    enterApp();
  } else {
    el("lerr").textContent = "账号或密码不对（都是 admin）";
  }
}
function logout(){
  try{ sessionStorage.removeItem(OK_KEY); }catch(e){}
  el("app").hidden = true;
  el("login").hidden = false;
  S = { profiles: [], posts: [], likes: [], comments: [], messages: [], records: [], at: 0, view: "dash" };
}
function enterApp(){
  el("login").hidden = true;
  el("app").hidden = false;
  loadCfg();
  refreshConn();
  go("dash");
}

/* ---------- 导航 ---------- */
var TITLES = { dash: "概览", users: "用户", posts: "动态", comments: "评论",
               chats: "私聊", records: "训练记录", settings: "连接设置" };
function go(v){
  S.view = v;
  el("vtitle").textContent = TITLES[v] || "概览";
  var bs = el("nav").querySelectorAll("button");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-v") === v);
  el("topact").innerHTML = "";
  render();
}
function render(){
  if (!connected()){ renderSettings(); return; }
  if (!S.at){ loadAll().then(render).catch(fail); return; }
  if (S.view === "dash") renderDash();
  else if (S.view === "users") renderUsers();
  else if (S.view === "posts") renderPosts();
  else if (S.view === "comments") renderComments();
  else if (S.view === "chats") renderChats();
  else if (S.view === "records") renderRecords();
  else renderSettings();
}
function fail(e){
  var msg = (e && e.message) || "载入失败";
  el("content").innerHTML =
    '<div class="banner"><div><b>读取失败：</b>' + esc(msg) +
    '<br>检查「连接设置」里的 Project URL、密钥，以及数据库是否已经跑过 <code>supabase.sql</code>。</div></div>' +
    '<button class="btn" onclick="reload()">重试</button>';
}

/* ---------- 拉数据 ---------- */
function loadAll(){
  el("content").innerHTML = '<div class="loading">读取数据…</div>';
  var jobs = [
    api("/rest/v1/profiles?select=*&order=created_at.desc&limit=1000"),
    api("/rest/v1/posts?select=id,uid,text,vis,ts&order=ts.desc&limit=1000"),
    api("/rest/v1/post_likes?select=post_id,uid&limit=5000"),
    api("/rest/v1/post_comments?select=id,post_id,uid,text,ts&order=ts.desc&limit=3000"),
    api("/rest/v1/messages?select=id,from_id,to_id,text,sticker,ts&order=ts.desc&limit=2000"),
    api("/rest/v1/records?select=uid,d,updated_at&order=d.desc&limit=3000").catch(function(){ return []; })
  ];
  return Promise.all(jobs).then(function(a){
    S.profiles = a[0] || [];
    S.posts = a[1] || [];
    S.likes = a[2] || [];
    S.comments = a[3] || [];
    S.messages = a[4] || [];
    S.records = a[5] || [];
    S.at = Date.now();
    S.recUser = S.recUser || "";
    paintCounts();
  });
}
function reload(){ S.at = 0; render(); }
function paintCounts(){
  el("nUsers").textContent = S.profiles.length || "";
  el("nPosts").textContent = S.posts.length || "";
  el("nComments").textContent = S.comments.length || "";
  el("nChats").textContent = S.messages.length || "";
  el("nRecords").textContent = S.records.length || "";
}
function userName(id){
  var u = null;
  for (var i = 0; i < S.profiles.length; i++) if (S.profiles[i].id === id) u = S.profiles[i];
  return u ? (u.name || "未命名") : "已注销";
}
function userById(id){
  for (var i = 0; i < S.profiles.length; i++) if (S.profiles[i].id === id) return S.profiles[i];
  return null;
}
function avOf(u){
  if (!u) return '<span class="av">👤</span>';
  if (u.avatar) return '<span class="av"><img src="' + esc(u.avatar) + '" alt=""></span>';
  return '<span class="av">' + esc(u.name ? u.name.slice(0, 1) : "👤") + '</span>';
}
function refreshConn(){
  var c = el("conn");
  if (!connected()){ c.innerHTML = '<span class="dot bad"></span>未连接'; return; }
  c.innerHTML = '<span class="dot ok"></span>' + (privileged() ? "管理模式" : "只读模式");
}

/* ---------- 概览 ---------- */
function renderDash(){
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var t0 = today.getTime();
  var newUsers = S.profiles.filter(function(u){
    var t = Date.parse(u.created_at || ""); return t && t >= t0;
  }).length;
  var todayPosts = S.posts.filter(function(p){ return Number(p.ts) >= t0; }).length;
  var friends = S.posts.filter(function(p){ return p.vis === "friends"; }).length;

  var h = "";
  if (!privileged()){
    h += '<div class="banner"><div><b>现在是只读模式。</b>只能看到公开资料与「全部人可见」的动态；' +
         '删除用户、管理私聊、查看训练记录需要管理密钥（<code>service_role</code>），到「连接设置」填一次即可。</div></div>';
  }
  h += '<div class="grid">' +
    stat(S.profiles.length, "注册用户") +
    stat(S.posts.length, "动态") +
    stat(S.comments.length, "评论") +
    stat(S.likes.length, "点赞") +
    stat(S.messages.length, "私聊消息") +
    stat(S.records.length, "训练记录") +
    stat(newUsers, "今天新用户") +
    stat(todayPosts, "今天新动态") +
    '</div>';

  h += '<h3 class="sec">最近动态</h3><div class="tblwrap"><table><tbody>';
  var ps = S.posts.slice(0, 8);
  h += ps.length ? ps.map(function(p){
    return '<tr><td>' + avOf(userById(p.uid)) + esc(userName(p.uid)) + '</td>' +
      '<td class="clip">' + esc(p.text || "（无文字）") + '</td>' +
      '<td class="num"><span class="tag' + (p.vis === "friends" ? "" : " on") + '">' +
      (p.vis === "friends" ? "仅好友" : "公开") + '</span></td>' +
      '<td class="num">' + esc(fromNow(p.ts)) + '</td></tr>';
  }).join("") : '<tr><td class="empty">还没有动态</td></tr>';
  h += '</tbody></table></div>';

  h += '<h3 class="sec" style="margin-top:16px">最近注册</h3><div class="tblwrap"><table><tbody>';
  var us = S.profiles.slice(0, 6);
  h += us.length ? us.map(function(u){
    return '<tr><td>' + avOf(u) + esc(u.name || "未命名") + '</td>' +
      '<td class="num">' + esc(u.phone || "—") + '</td>' +
      '<td class="num">' + esc(fmtTs(Date.parse(u.created_at || ""))) + '</td></tr>';
  }).join("") : '<tr><td class="empty">还没有用户</td></tr>';
  h += '</tbody></table></div>';

  el("topact").innerHTML = '<button class="btn" onclick="reload()">刷新</button>' +
    '<span class="tag">' + (S.at ? esc(fromNow(S.at)) + " 更新" : "") + '</span>';
  el("content").innerHTML = h;
}
function stat(v, label){
  return '<div class="stat"><b>' + num(v) + '</b><span>' + esc(label) + '</span></div>';
}

/* ---------- 用户 ---------- */
function renderUsers(){
  var k = Q.users.trim().toLowerCase();
  var rows = S.profiles.filter(function(u){
    if (!k) return true;
    return String(u.name || "").toLowerCase().indexOf(k) >= 0 ||
           String(u.phone || "").indexOf(k) >= 0;
  });
  el("topact").innerHTML =
    '<span class="srch"><input id="qUsers" placeholder="搜昵称 / 手机号" value="' + esc(Q.users) + '" ' +
    'oninput="Q.users=this.value;renderUsers()"></span>' +
    '<button class="btn" onclick="reload()">刷新</button>';

  var h = '<div class="tblwrap"><table><thead><tr>' +
    '<th>用户</th><th>手机号</th><th>注册时间</th><th>动态</th><th></th>' +
    '</tr></thead><tbody>';
  h += rows.length ? rows.map(function(u){
    var pc = S.posts.filter(function(p){ return p.uid === u.id; }).length;
    return '<tr><td>' + avOf(u) + '<b>' + esc(u.name || "未命名") + '</b></td>' +
      '<td class="num">' + esc(u.phone || "—") + '</td>' +
      '<td class="num">' + esc(fmtTs(Date.parse(u.created_at || ""))) + '</td>' +
      '<td class="num">' + pc + '</td>' +
      '<td class="act"><button class="btn sm" onclick="viewUser(\'' + u.id + '\')">查看</button> ' +
      '<button class="btn sm danger" onclick="delUser(\'' + u.id + '\')">删除</button></td></tr>';
  }).join("") : '<tr><td colspan="5" class="empty">没有匹配的用户</td></tr>';
  h += '</tbody></table></div>';
  el("content").innerHTML = h;
}
function viewUser(id){
  var u = userById(id);
  if (!u) return;
  var posts = S.posts.filter(function(p){ return p.uid === id; });
  var recs = S.records.filter(function(r){ return r.uid === id; });
  var h = '<div class="mhead"><b>' + esc(u.name || "未命名") + '</b>' +
    '<button class="mclose" onclick="closeModal()">✕</button></div>' +
    '<div class="kv"><span>用户 ID</span><div style="word-break:break-all">' + esc(u.id) + '</div>' +
    '<span>手机号</span><div>' + esc(u.phone || "—") + '</div>' +
    '<span>注册时间</span><div>' + esc(fmtTs(Date.parse(u.created_at || ""))) + '</div>' +
    '<span>动态</span><div>' + posts.length + ' 条</div>' +
    '<span>训练记录</span><div>' + (recs.length ? recs.length + " 天" : (privileged() ? "0 天" : "需管理密钥")) + '</div>' +
    '</div>';
  h += '<h3 class="sec" style="margin-top:14px">最近动态</h3>';
  h += posts.length ? '<div class="tblwrap"><table><tbody>' + posts.slice(0, 8).map(function(p){
    return '<tr><td class="clip">' + esc(p.text || "（无文字）") + '</td>' +
      '<td class="num">' + esc(fromNow(p.ts)) + '</td>' +
      '<td class="act"><button class="btn sm" onclick="viewPost(\'' + p.id + '\')">打开</button></td></tr>';
  }).join("") + '</tbody></table></div>' : '<div class="empty">还没有发过动态</div>';
  h += '<div class="mfoot"><button class="btn" onclick="closeModal()">关闭</button></div>';
  openModal(h);
}
function delUser(id){
  if (!privileged()){
    toast("删除用户需要管理密钥，去「连接设置」填 service_role");
    return;
  }
  confirmBox("删除用户", "确定删除 <b>" + esc(userName(id)) + "</b> 吗？<br>" +
    "会一并删除他的资料、动态、点赞、评论、私聊与训练记录，<b>不可恢复</b>。", "删除",
    function(){
      api("/auth/v1/admin/users/" + encodeURIComponent(id), { method: "DELETE" })
        .then(function(){
          S.profiles = S.profiles.filter(function(u){ return u.id !== id; });
          S.posts = S.posts.filter(function(p){ return p.uid !== id; });
          S.comments = S.comments.filter(function(c){ return c.uid !== id; });
          S.likes = S.likes.filter(function(l){ return l.b !== id; });
          S.messages = S.messages.filter(function(m){ return m.from_id !== id && m.to_id !== id; });
          S.records = S.records.filter(function(r){ return r.uid !== id; });
          paintCounts(); renderUsers(); toast("已删除该用户");
        }).catch(function(e){ toast("删除失败：" + e.message); });
    });
}

/* ---------- 动态 ---------- */
function renderPosts(){
  var k = Q.posts.trim().toLowerCase();
  var vis = Q.postsVis;
  var rows = S.posts.filter(function(p){
    if (vis === "public" && p.vis === "friends") return false;
    if (vis === "friends" && p.vis !== "friends") return false;
    if (k && String(p.text || "").toLowerCase().indexOf(k) < 0) return false;
    return true;
  });
  el("topact").innerHTML =
    '<span class="srch"><input id="qPosts" placeholder="搜动态内容" value="' + esc(Q.posts) + '" ' +
    'oninput="Q.posts=this.value;renderPosts()"></span>' +
    '<select class="sel" onchange="Q.postsVis=this.value;renderPosts()">' +
      '<option value="all"' + (vis === "all" ? " selected" : "") + '>全部可见性</option>' +
      '<option value="public"' + (vis === "public" ? " selected" : "") + '>仅看公开</option>' +
      '<option value="friends"' + (vis === "friends" ? " selected" : "") + '>仅看好友可见</option>' +
    '</select>' +
    '<button class="btn" onclick="reload()">刷新</button>';

  var h = '<div class="tblwrap"><table><thead><tr>' +
    '<th>作者</th><th>内容</th><th>可见性</th><th>赞</th><th>评</th><th>时间</th><th></th>' +
    '</tr></thead><tbody>';
  h += rows.length ? rows.map(function(p){
    var lc = S.likes.filter(function(l){ return l.post_id === p.id; }).length;
    var cc = S.comments.filter(function(c){ return c.post_id === p.id; }).length;
    return '<tr><td>' + avOf(userById(p.uid)) + esc(userName(p.uid)) + '</td>' +
      '<td class="clip">' + esc(p.text || "（无文字）") + '</td>' +
      '<td class="num"><span class="tag' + (p.vis === "friends" ? "" : " on") + '">' +
        (p.vis === "friends" ? "仅好友" : "公开") + '</span></td>' +
      '<td class="num">' + lc + '</td><td class="num">' + cc + '</td>' +
      '<td class="num">' + esc(fromNow(p.ts)) + '</td>' +
      '<td class="act"><button class="btn sm" onclick="viewPost(\'' + p.id + '\')">查看</button> ' +
        '<button class="btn sm danger" onclick="delPost(\'' + p.id + '\')">删除</button></td></tr>';
  }).join("") : '<tr><td colspan="7" class="empty">没有匹配的动态</td></tr>';
  h += '</tbody></table></div>';
  el("content").innerHTML = h;
}
function viewPost(id){
  openModal('<div class="mhead"><b>动态详情</b><button class="mclose" onclick="closeModal()">✕</button></div>' +
            '<div class="loading">载入中…</div>');
  api("/rest/v1/posts?id=eq." + encodeURIComponent(id) + "&select=*").then(function(rows){
    var p = rows && rows[0];
    if (!p) throw new Error("这条动态已经不存在了");
    var imgs = Array.isArray(p.images) ? p.images : [];
    var wk = Array.isArray(p.workout) ? p.workout : [];
    var lc = S.likes.filter(function(l){ return l.post_id === p.id; }).length;
    var cc = S.comments.filter(function(c){ return c.post_id === p.id; });
    var h = '<div class="mhead"><b>' + esc(userName(p.uid)) + ' 的动态</b>' +
      '<button class="mclose" onclick="closeModal()">✕</button></div>';
    h += '<div class="kv"><span>可见性</span><div>' + (p.vis === "friends" ? "仅好友可见" : "全部人可见") + '</div>' +
      '<span>时间</span><div>' + esc(fmtTs(p.ts)) + '</div>' +
      '<span>点赞</span><div>' + lc + ' 个</div>' +
      '<span>评论</span><div>' + cc.length + ' 条</div></div>';
    if (p.text) h += '<div class="card pad" style="margin-top:12px;white-space:pre-wrap;word-break:break-word">' +
      esc(p.text) + '</div>';
    if (imgs.length) h += '<div class="mimgs">' + imgs.map(function(d){
      return '<a href="' + esc(d) + '" target="_blank" rel="noopener"><img src="' + esc(d) + '" alt=""></a>';
    }).join("") + '</div>';
    if (wk.length) h += '<div style="margin-top:8px;font-size:12px;color:var(--sub)">今日成果：' +
      wk.map(function(x){ return esc(x.n) + " <b>" + esc(x.v) + "</b> " + esc(x.u || ""); }).join(" · ") + '</div>';
    if (cc.length){
      h += '<h3 class="sec" style="margin-top:14px">评论</h3><div class="tblwrap"><table><tbody>' +
        cc.map(function(c){
          return '<tr><td>' + esc(userName(c.uid)) + '</td><td class="clip">' + esc(c.text) + '</td>' +
            '<td class="num">' + esc(fromNow(c.ts)) + '</td>' +
            '<td class="act"><button class="btn sm danger" onclick="delComment(\'' + c.id + '\',1)">删</button></td></tr>';
        }).join("") + '</tbody></table></div>';
    }
    h += '<div class="mfoot"><button class="btn" onclick="closeModal()">关闭</button>' +
      '<button class="btn danger" onclick="delPost(\'' + p.id + '\')">删除这条动态</button></div>';
    openModal(h);
  }).catch(function(e){
    openModal('<div class="mhead"><b>出错了</b><button class="mclose" onclick="closeModal()">✕</button></div>' +
      '<div class="empty">' + esc(e.message) + '</div>');
  });
}
function delPost(id){
  confirmBox("删除动态", "删除后这条动态和它下面的点赞、评论都会一起消失，<b>不可恢复</b>。", "删除", function(){
    api("/rest/v1/posts?id=eq." + encodeURIComponent(id), { method: "DELETE" }).then(function(){
      S.posts = S.posts.filter(function(p){ return p.id !== id; });
      S.likes = S.likes.filter(function(l){ return l.post_id !== id; });
      S.comments = S.comments.filter(function(c){ return c.post_id !== id; });
      paintCounts(); render(); toast("已删除");
    }).catch(function(e){ toast("删除失败：" + e.message); });
  });
}

/* ---------- 评论 ---------- */
function renderComments(){
  var k = Q.comments.trim().toLowerCase();
  var rows = S.comments.filter(function(c){
    return !k || String(c.text || "").toLowerCase().indexOf(k) >= 0;
  });
  el("topact").innerHTML =
    '<span class="srch"><input placeholder="搜评论内容" value="' + esc(Q.comments) + '" ' +
    'oninput="Q.comments=this.value;renderComments()"></span>' +
    '<button class="btn" onclick="reload()">刷新</button>';
  var h = '<div class="tblwrap"><table><thead><tr>' +
    '<th>评论者</th><th>内容</th><th>所属动态</th><th>时间</th><th></th></tr></thead><tbody>';
  h += rows.length ? rows.map(function(c){
    var post = null;
    for (var i = 0; i < S.posts.length; i++) if (S.posts[i].id === c.post_id) post = S.posts[i];
    return '<tr><td>' + avOf(userById(c.uid)) + esc(userName(c.uid)) + '</td>' +
      '<td class="clip">' + esc(c.text) + '</td>' +
      '<td class="clip" style="color:var(--sub)">' + esc(post ? (post.text || "（无文字）") : "已删除的动态") + '</td>' +
      '<td class="num">' + esc(fromNow(c.ts)) + '</td>' +
      '<td class="act"><button class="btn sm danger" onclick="delComment(\'' + c.id + '\')">删除</button></td></tr>';
  }).join("") : '<tr><td colspan="5" class="empty">还没有评论</td></tr>';
  h += '</tbody></table></div>';
  el("content").innerHTML = h;
}
function delComment(id, inModal){
  confirmBox("删除评论", "删除后不可恢复。", "删除", function(){
    api("/rest/v1/post_comments?id=eq." + encodeURIComponent(id), { method: "DELETE" }).then(function(){
      S.comments = S.comments.filter(function(c){ return c.id !== id; });
      paintCounts(); render(); toast("已删除评论");
    }).catch(function(e){ toast("删除失败：" + e.message); });
  });
}

/* ---------- 私聊 ---------- */
function renderChats(){
  var k = Q.chats.trim().toLowerCase();
  var rows = S.messages.filter(function(m){
    if (!k) return true;
    var s = (userName(m.from_id) + userName(m.to_id) + (m.text || "") + (m.sticker || "")).toLowerCase();
    return s.indexOf(k) >= 0;
  });
  el("topact").innerHTML =
    '<span class="srch"><input placeholder="搜昵称 / 内容" value="' + esc(Q.chats) + '" ' +
    'oninput="Q.chats=this.value;renderChats()"></span>' +
    '<button class="btn" onclick="reload()">刷新</button>';
  var h = '';
  if (!privileged()) h += '<div class="banner"><div><b>私聊内容受数据库权限保护</b>，' +
    '只读模式读不到。到「连接设置」填 service_role 才能查看与清理。</div></div>';
  h += '<div class="tblwrap"><table><thead><tr>' +
    '<th>发送</th><th>接收</th><th>内容</th><th>时间</th><th></th></tr></thead><tbody>';
  h += rows.length ? rows.map(function(m){
    var body = m.sticker ? (m.sticker + " " + (m.text || "")) : (m.text || "（图片消息）");
    return '<tr><td>' + esc(userName(m.from_id)) + '</td><td>' + esc(userName(m.to_id)) + '</td>' +
      '<td class="clip">' + esc(body) + '</td>' +
      '<td class="num">' + esc(fromNow(m.ts)) + '</td>' +
      '<td class="act"><button class="btn sm danger" onclick="delMsg(\'' + m.id + '\')">删除</button></td></tr>';
  }).join("") : '<tr><td colspan="5" class="empty">没有可以显示的私聊消息</td></tr>';
  h += '</tbody></table></div>';
  el("content").innerHTML = h;
}
function delMsg(id){
  confirmBox("删除消息", "只删除云端这一条，对方本机缓存里可能还留着。", "删除", function(){
    api("/rest/v1/messages?id=eq." + encodeURIComponent(id), { method: "DELETE" }).then(function(){
      S.messages = S.messages.filter(function(m){ return m.id !== id; });
      paintCounts(); renderChats(); toast("已删除");
    }).catch(function(e){ toast("删除失败：" + e.message); });
  });
}

/* ---------- 训练记录 ---------- */
function renderRecords(){
  if (!Q.recUser && S.profiles.length) Q.recUser = S.profiles[0].id;
  var u = userById(Q.recUser);
  var rows = S.records.filter(function(r){ return r.uid === Q.recUser; });
  el("topact").innerHTML =
    '<select class="sel" onchange="Q.recUser=this.value;renderRecords()">' +
    S.profiles.map(function(p){
      return '<option value="' + esc(p.id) + '"' + (p.id === Q.recUser ? " selected" : "") + '>' +
        esc(p.name || p.phone || p.id) + '</option>';
    }).join("") + '</select>' +
    '<button class="btn" onclick="reload()">刷新</button>';
  var h = '';
  if (!privileged()) h += '<div class="banner"><div><b>训练记录只有本人可读写</b>（数据库行级权限），' +
    '只读模式看不到。填 service_role 后才能查。</div></div>';
  h += '<div class="card pad" style="margin-bottom:12px"><div class="kv">' +
    '<span>用户</span><div>' + esc(u ? (u.name || "未命名") + " · " + (u.phone || "") : "未选择") + '</div>' +
    '<span>记录天数</span><div>' + rows.length + ' 天</div>' +
    '<span>最近记录</span><div>' + (rows.length ? esc(fmtTs(Date.parse(rows[0].updated_at || ""))) : "—") + '</div>' +
    '</div></div>';
  h += '<div class="tblwrap"><table><thead><tr><th>日期</th><th>最近更新</th></tr></thead><tbody>';
  h += rows.length ? rows.slice(0, 200).map(function(r){
    return '<tr><td class="num">' + esc(r.d) + '</td><td class="num">' +
      esc(fmtTs(Date.parse(r.updated_at || ""))) + '</td></tr>';
  }).join("") : '<tr><td colspan="2" class="empty">没有可显示的记录</td></tr>';
  h += '</tbody></table></div>';
  el("content").innerHTML = h;
}

/* ---------- 连接设置 ---------- */
function renderSettings(){
  var h = '';
  if (!connected()){
    h += '<div class="banner"><div><b>还差一步：</b>填好 Project URL 与 anon key 就能看数据；' +
      '要删除用户、清理私聊、看训练记录，再填 service_role。</div></div>';
  } else if (!privileged()){
    h += '<div class="banner"><div><b>只读模式：</b>当前用的是 anon key，能看公开资料与公开动态。' +
      '填 service_role 可解锁全部管理能力。</div></div>';
  }
  h += '<div class="card pad">' +
    '<div class="fld"><label>Project URL</label>' +
      '<input id="cfgUrl" placeholder="https://xxxxxxxx.supabase.co" value="' + esc(CFG.url) + '"></div>' +
    '<div class="fld"><label>anon / publishable key</label>' +
      '<input id="cfgKey" placeholder="sb_publishable_..." value="' + esc(CFG.key) + '">' +
      '<div class="hint">在 Supabase → Project Settings → API 里复制。这个 key 是给客户端用的，受行级权限保护。</div></div>' +
    '<div class="fld"><label>service_role key（可选，用于管理全部数据）</label>' +
      '<input id="cfgSecret" type="password" placeholder="eyJhbGciOi..." value="' + esc(CFG.secret) + '">' +
      '<div class="hint">同一个页面往下滚有 <code>service_role</code>。它等于管理员密码，' +
      '只存在你这台设备的浏览器里，不会写进代码或仓库；不用时点下面「清除密钥」。</div></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn primary" onclick="applyCfg()">保存并连接</button>' +
      '<button class="btn" onclick="clearSecret()">清除密钥</button>' +
      '<button class="btn" onclick="exportAll()">导出全部数据</button>' +
    '</div>' +
  '</div>';
  h += '<div class="card pad" style="margin-top:12px">' +
    '<h3 class="sec">数据库建表脚本</h3>' +
    '<div style="font-size:12.5px;color:var(--sub);line-height:1.75">' +
    '第一次用要先在 Supabase 的 <b>SQL Editor</b> 里整段执行仓库根目录的 <code>supabase.sql</code>，' +
    '共 8 张表（profiles / follows / posts / messages / records / settings / post_likes / post_comments）带行级权限。' +
    '脚本可重复执行，不会动已有数据。</div></div>';
  el("topact").innerHTML = '<button class="btn" onclick="reload()">刷新</button>';
  el("content").innerHTML = h;
}
function applyCfg(){
  CFG.url = (el("cfgUrl").value || "").trim();
  CFG.key = (el("cfgKey").value || "").trim();
  CFG.secret = (el("cfgSecret").value || "").trim();
  if (!CFG.url || !(CFG.key || CFG.secret)){
    toast("Project URL 和至少一个 key 都要填");
    return;
  }
  saveCfg();
  refreshConn();
  S.at = 0;
  loadAll().then(function(){
    toast("已连接 · " + S.profiles.length + " 位用户");
    go("dash");
  }).catch(function(e){
    el("content").innerHTML = '<div class="banner"><div><b>连不上：</b>' + esc(e.message) +
      '<br>检查 URL 是否带 https://、key 是否完整、数据库是否已执行建表脚本。</div></div>';
  });
}
function clearSecret(){
  CFG.secret = "";
  saveCfg();
  refreshConn();
  toast("已清除管理密钥");
  go("settings");
}
function exportAll(){
  var dump = { exportedAt: new Date().toISOString(), profiles: S.profiles, posts: S.posts,
    likes: S.likes, comments: S.comments, messages: S.messages, records: S.records };
  var blob = new Blob([JSON.stringify(dump, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pushup-admin-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("已导出 JSON");
}

/* 给内联事件用的最小导出 */
window.doLogin = doLogin; window.logout = logout; window.go = go;
window.reload = reload; window.renderUsers = renderUsers; window.renderPosts = renderPosts;
window.renderComments = renderComments; window.renderChats = renderChats;
window.renderRecords = renderRecords; window.viewUser = viewUser; window.viewPost = viewPost;
window.delUser = delUser; window.delPost = delPost; window.delComment = delComment;
window.delMsg = delMsg; window.applyCfg = applyCfg; window.clearSecret = clearSecret;
window.exportAll = exportAll; window.closeModal = closeModal; window.Q = Q;

/* 启动 */
loadCfg();
var ok = false;
try{ ok = sessionStorage.getItem(OK_KEY) === "1"; }catch(e){}
if (ok) enterApp(); else { el("login").hidden = false; }
</script>
